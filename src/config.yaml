# ============================================================================
# Configuration for the HDB resale-price regression pipeline.
# Everything the pipeline needs is declared here so nothing is hard-coded in the
# Python modules. main.py validates this file on load.
# ============================================================================

# Data settings
file_path: ./data/resale_transactions.csv
target_column: resale_price

# Reproducibility — one seed used for splitting AND every stochastic model.
random_seed: 42

# Feature settings (names are AFTER cleaning/engineering in data_preparation.py)
numerical_features:
  - floor_area_sqm
  - remaining_lease_months
  - lease_commence_date
  - year
nominal_features:
  - month
  - town_name
  - flatm_name
ordinal_features:
  - flat_type
passthrough_features:
  - storey_range

flat_type_categories:
  - 1 ROOM
  - 2 ROOM
  - 3 ROOM
  - 4 ROOM
  - 5 ROOM
  - MULTI-GENERATION
  - EXECUTIVE

# Preprocessing — imputation runs inside the sklearn pipeline (fit on train only).
numeric_imputer_strategy: median
categorical_imputer_strategy: most_frequent

# Data splitting: 80% train / 10% val / 10% test.
val_test_size: 0.2
val_size: 0.5

# Model selection policy (evaluated on the validation set).
selection_metric: R2     # one of MAE, MSE, RMSE, R2
selection_mode: max      # max for R2, min for error metrics
selection_tiebreak: RMSE # deterministic secondary rule (lower error wins) if the
                         # primary metric ties; the model name breaks any final tie.

# Optional feature-selection stage inside the model pipeline (off by default).
# method: variance_threshold (threshold) | select_k_best (k). Enable to experiment
# from config without touching code.
feature_selection:
  enabled: false
  method: variance_threshold
  threshold: 0.0

# Cross-validation used by the tuning search.
cv: 3
scoring: r2

# Models to train and (optionally) tune. An empty grid => fit with defaults,
# which is how the DummyRegressor baseline and the plain linear model run.
models:
  dummy:
    estimator: DummyRegressor
    grid: {}
  linear_regression:
    estimator: LinearRegression
    grid: {}
  ridge:
    estimator: Ridge
    grid:
      regressor__alpha: [0.1, 1, 10, 100, 1000]
  lasso:
    estimator: Lasso
    grid:
      regressor__alpha: [0.1, 1, 10, 100, 1000]
  random_forest:
    estimator: RandomForestRegressor
    grid:
      regressor__n_estimators: [200]
      regressor__max_depth: [20, 30]
      regressor__min_samples_leaf: [2]
  # Histogram-based gradient boosting — far faster than the classic version on
  # this row count, so a real search stays affordable.
  gradient_boosting:
    estimator: HistGradientBoostingRegressor
    grid:
      regressor__max_iter: [200, 400]
      regressor__learning_rate: [0.05, 0.1]

# Where trained artifacts are written.
artifacts_dir: ./artifacts
